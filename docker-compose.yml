version: '3.8'

services:
  vibemonitor:
    build: .
    container_name: vibemonitor
    restart: always
    ports:
      - "25774:25774"
    volumes:
      - ./data:/app/data
    environment:
      - VIBEMONITOR_LISTEN=0.0.0.0:25774
      - VIBEMONITOR_DATA=/app/data/vibemonitor-data.json
      # 可选：预设管理员密码，若不设首次启动会在日志中随机打印
      # - VIBEMONITOR_ADMIN_PASSWORD=your_secure_password
