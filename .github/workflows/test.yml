name: Validate Linux (x86-64 & arm64)

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in internal/web/dist/*.js; do node --check "$file"; done
      - run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix scripts
      - run: bash -n install.sh
      - run: bash scripts/check_installer_health.sh
      - run: bash scripts/check_installer_rollback.sh
      - run: make release-all
