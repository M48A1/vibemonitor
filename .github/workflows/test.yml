name: Test Linux (x86-64 & arm64)

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: if [ -f internal/web/app_test.cjs ]; then node --test internal/web/app_test.cjs; fi
      - run: if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
      - run: make release-all
