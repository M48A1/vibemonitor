name: Release and Build Binaries

on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(cat RELEASE_VERSION)"
            # Never overwrite a previously published version from a main push.
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" > /tmp/release-refs.json
            if jq -e --arg ref "refs/tags/$VERSION" 'any(.[]; .ref == $ref)' /tmp/release-refs.json; then
              echo "Release tag $VERSION already exists; bump RELEASE_VERSION."
              exit 1
            fi
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Validate Go
        run: |
          go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in internal/web/dist/*.js; do node --check "$file"; done
      - run: bash -n install.sh
      - run: bash scripts/check_installer_health.sh
      - run: bash scripts/check_installer_rollback.sh

      - name: Build Linux Binaries (AMD64 & ARM64)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist

          echo "Building for tag: $VERSION"

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X vibemonitor/internal/version.Version=$VERSION -X vibemonitor/internal/version.Commit=$GITHUB_SHA" -o dist/vibemonitor .
          tar -czf dist/vibemonitor-linux-amd64.tar.gz -C dist vibemonitor
          cp dist/vibemonitor dist/vibemonitor-linux-amd64
          rm dist/vibemonitor

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X vibemonitor/internal/version.Version=$VERSION -X vibemonitor/internal/version.Commit=$GITHUB_SHA" -o dist/vibemonitor .
          tar -czf dist/vibemonitor-linux-arm64.tar.gz -C dist vibemonitor
          cp dist/vibemonitor dist/vibemonitor-linux-arm64
          rm dist/vibemonitor

          cp install.sh dist/install.sh

          # Generate SHA256 checksums
          cd dist
          sha256sum * > sha256sums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
