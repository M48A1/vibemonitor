name: Release and Build Binaries

on:
  push:
    tags:
      - 'v*'
  # Re-run a release for a tag that already exists (Actions → Run workflow →
  # choose the tag), e.g. after a failed validation step. Nothing new is tagged.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        run: |
          VERSION="$GITHUB_REF_NAME"
          # The tag is stamped into the binary and names the release, so it has to
          # be numeric: v1.2 or v1.2.3. A tag like "v1" or "v1.2.3-rc1" fails here
          # instead of producing an unlabelled build.
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::tag '$VERSION' is not a release version; use v<major>.<minor> or v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Validate Go
        run: |
          go vet ./...

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: for file in internal/web/dist/*.js; do node --check "$file"; done
      - run: bash -n install.sh

      - name: Build Linux Binaries (AMD64 & ARM64)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist

          echo "Building for tag: $VERSION"

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X vibemonitor/internal/version.Version=$VERSION -X vibemonitor/internal/version.Commit=$GITHUB_SHA" -o dist/vibemonitor .
          tar -czf dist/vibemonitor-linux-amd64.tar.gz -C dist vibemonitor
          cp dist/vibemonitor dist/vibemonitor-linux-amd64
          rm dist/vibemonitor

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X vibemonitor/internal/version.Version=$VERSION -X vibemonitor/internal/version.Commit=$GITHUB_SHA" -o dist/vibemonitor .
          tar -czf dist/vibemonitor-linux-arm64.tar.gz -C dist vibemonitor
          cp dist/vibemonitor dist/vibemonitor-linux-arm64
          rm dist/vibemonitor

          cp install.sh dist/install.sh

          # Generate SHA256 checksums
          cd dist
          sha256sum * > sha256sums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
