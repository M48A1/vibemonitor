name: Release and Build Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test internal/web/app_test.cjs
      - run: python3 -m unittest discover -s tests -v

      - name: Build Linux x86-64 Release
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}

          echo "Building for tag: $VERSION"

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X vibemonitor/internal/version.Version=$VERSION -X vibemonitor/internal/version.Commit=$GITHUB_SHA" -o dist/vibemonitor .
          tar -czf dist/vibemonitor-linux-amd64.tar.gz -C dist vibemonitor
          cp dist/vibemonitor dist/vibemonitor-linux-amd64
          rm dist/vibemonitor

          cp install.sh dist/install.sh

          # Generate SHA256 checksums
          cd dist
          sha256sum * > sha256sums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
