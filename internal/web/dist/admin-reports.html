<!DOCTYPE html>
<html lang="zh-CN" data-site-theme="design" data-site-layout="cards" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="VibeMonitor 管理后台 · 日报管理">
  <meta name="theme-color" content="#eeece8">
  <title>日报管理 · 管理后台</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/design.css" id="customThemeStylesheet">
  <link rel="icon" id="siteIcon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%230d9488'/></svg>">
</head>
<body class="admin-body" data-page-title="日报管理">
  <a class="admin-skip" href="#adminMain">跳到主要内容</a>
  <header class="admin-topbar">
    <a class="admin-brand" href="/admin/nodes">
      <img class="admin-brand-icon" id="adminBrandIcon" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%230d9488'/></svg>">
      <span id="adminBrandTitle">VibeMonitor</span>
    </a>
    <div class="admin-topbar-actions">
      <a class="btn" href="/">监控面板</a>
      <button type="button" class="btn" id="adminLogoutBtn" hidden>退出登录</button>
    </div>
  </header>

  <div class="admin-shell">
    <nav class="admin-sidebar" id="adminSidebar" aria-label="管理后台导航">
      <a class="admin-nav-link" href="/admin/nodes" data-admin-nav="nodes">节点管理</a>
      <a class="admin-nav-link" href="/admin/rankings" data-admin-nav="rankings">排行榜</a>
      <a class="admin-nav-link" href="/admin/settings" data-admin-nav="settings">基本设置</a>
      <a class="admin-nav-link" href="/admin/theme" data-admin-nav="theme">主题管理</a>
      <a class="admin-nav-link" href="/admin/reports" data-admin-nav="reports">日报管理</a>
      <a class="admin-nav-link" href="/admin/telegram" data-admin-nav="telegram">外部通信设置</a>
      <a class="admin-nav-link admin-nav-public" href="/">返回监控面板</a>
      <span class="admin-nav-foot">VibeMonitor 管理后台</span>
    </nav>

    <main class="admin-main" id="adminMain">
      <p class="admin-loading" id="adminLoading">正在验证管理员登录状态…</p>

      <div id="adminContent" hidden>
        <div class="admin-page-head">
          <h1 class="admin-title">日报管理</h1>
        </div>

        <section class="admin-card" aria-labelledby="reportManualTitle">
          <h2 class="admin-card-title" id="reportManualTitle">手动生成</h2>
          <form class="admin-form" id="reportManualForm">
            <div class="admin-form-grid">
              <div class="form-group">
                <label class="form-label" for="reportDate">统计日期</label>
                <input type="date" class="form-input" id="reportDate">
                <small>留空生成最近一个已结束的统计日。已有汇总会复用。</small>
              </div>
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="btn btn-primary">生成日报</button>
            </div>
          </form>
        </section>

        <section class="admin-card" aria-labelledby="reportScheduleTitle">
          <h2 class="admin-card-title" id="reportScheduleTitle">自动生成</h2>
          <form class="admin-form" id="reportScheduleForm">
            <div class="form-group">
              <label><input type="checkbox" id="reportScheduleEnabled"> 启用自动生成</label>
            </div>
            <div class="admin-form-grid">
              <div class="form-group">
                <label class="form-label" for="reportScheduleTime">每天生成时间</label>
                <input type="time" class="form-input" id="reportScheduleTime" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="reportScheduleTimezone">生成时区</label>
                <select class="form-input" id="reportScheduleTimezone" required></select>
              </div>
            </div>
            <p class="form-note">生成时区决定任务什么时候运行。统计日期仍按各节点自己的时区切日，所有节点结束该统计日后才归档。</p>
            <div class="admin-form-actions">
              <button type="submit" class="btn btn-primary">保存自动生成设置</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <p class="admin-status" id="adminStatus" role="status" aria-live="polite" hidden></p>

  <script src="/admin-core.js"></script>
  <script src="/admin-reports.js"></script>
</body>
</html>
